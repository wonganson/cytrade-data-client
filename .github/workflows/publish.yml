name: Publish to PyPI

# Triggered by publishing a GitHub Release (tag it with the version, e.g. v0.1.0).
# Uses PyPI Trusted Publishing — no API token stored in this repo. One-time setup
# required on pypi.org: project Settings -> Publishing -> add a trusted publisher
# for this repo/workflow (owner: wonganson, repo: cytrade-data-client,
# workflow: publish.yml, environment: pypi).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
