[project]
name = "cytrade-data-client"
version = "0.1.0"
description = "Python SDK for the Cytrade data gateway — one call for both backtest and live data."
requires-python = ">=3.9"
dependencies = ["requests", "pandas"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cytrade_client*"]
